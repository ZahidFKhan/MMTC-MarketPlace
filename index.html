<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMTC Prototypes</title>
<style>
  :root{
    --bg:#0f1115;
    --surface:#171a21;
    --surface-2:#1e222b;
    --border:#2a2f3a;
    --text:#f2f3f5;
    --text-dim:#9aa2b1;
    --gold:#e8b64f;
    --accent:#3d7bff;
    font-family:-apple-system,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,#05060a,#12141a);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:48px 16px;
  }
  .wrap{width:100%; max-width:560px;}
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:700; font-size:22px; margin-bottom:6px;
  }
  .logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--gold),#a97a1f);
    display:flex;align-items:center;justify-content:center;
    font-size:15px; color:#1a1200; font-weight:800;
  }
  .sub{color:var(--text-dim); font-size:14px; margin:0 0 28px;}
  .list{display:flex; flex-direction:column; gap:12px;}
  .card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    color:inherit;
    text-decoration:none;
    transition:border-color .15s, background .15s;
  }
  .card:hover, .card:focus-visible{border-color:var(--accent); background:var(--surface-2); outline:none;}
  .card .name{font-weight:600; font-size:16px;}
  .card .desc{color:var(--text-dim); font-size:13px; margin-top:3px;}
  .card .file{color:var(--text-dim); font-size:12px; font-family:ui-monospace,Menlo,monospace; margin-top:6px;}
  .card .arrow{color:var(--text-dim); font-size:18px; flex:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">M</div>MMTC Prototypes</div>
  <p class="sub">All prototype screens in one place.</p>

  <nav class="list">
    <a class="card" href="liverates.html">
      <div>
        <div class="name">Live Rates</div>
        <div class="desc">Live gold &amp; silver prices with seller-wise rates</div>
        <div class="file">liverates.html</div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="clogin.html">
      <div>
        <div class="name">Customer Login</div>
        <div class="desc">Customer sign-in screen</div>
        <div class="file">clogin.html</div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="jregisteration.html">
      <div>
        <div class="name">Jeweller Registration</div>
        <div class="desc">Seller onboarding form for jewellers</div>
        <div class="file">jregisteration.html</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </nav>
</div>
</body>
</html>
